# One pipeline for the whole flow (two long-lived branches, two environments):
#   every PR / push     -> check   (format, lint, typecheck, tests, build)
#   PR into dev         -> preview (version of <name>-dev with a per-PR URL)
#   push to dev         -> deploy  (dev environment,  Worker <name>-dev)
#   push to main        -> deploy  (production,       Worker <name>)
# Feature branches merge into dev; dev is merged into main to release.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  preview:
    name: preview
    needs: check
    # Only feature PRs into dev (a dev -> main release PR is already live on
    # the dev URL). Fork PRs get no secrets, so only this repository's branches.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Ensure dev D1 / KV exist
        run: node scripts/cf-resources.mjs --env dev
      - name: Apply D1 migrations (dev database)
        run: npx wrangler d1 migrations apply DB --env dev --remote
      - run: npm run build
      - name: Create the dev Worker on first run
        run: npx wrangler deployments list > /dev/null 2>&1 || npx wrangler deploy
      - name: Upload version with a per-PR preview URL
        id: upload
        run: |
          alias="pr-${{ github.event.pull_request.number }}"
          out=$(npx wrangler versions upload --preview-alias "$alias" \
            --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}" 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | sed -n 's/.*Version Preview Alias URL: *\(https:[^ ]*\).*/\1/p' | head -n1)
          if [ -z "$url" ]; then
            echo "::error::wrangler did not print a preview URL (are preview_urls and workers.dev enabled?)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the preview URL on the PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = "<!-- cloudflare-preview -->"
            const sha = context.payload.pull_request.head.sha.slice(0, 7)
            const body = [
              marker,
              `**Preview:** ${process.env.PREVIEW_URL}`,
              "",
              `Commit \`${sha}\` · dev D1/KV (not production data).`,
            ].join("\n")
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  deploy:
    name: deploy
    needs: check
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Never run two deploys of the same environment at once, nor cancel one.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Wrangler environment: "dev" = env.dev, "" = top level (production).
      # Keep '' as the fallback: in `a && '' || b`, '' is falsy and yields b.
      WRANGLER_ENV: ${{ github.ref_name == 'dev' && 'dev' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Ensure D1 / KV exist
        run: node scripts/cf-resources.mjs ${WRANGLER_ENV:+--env $WRANGLER_ENV}
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB ${WRANGLER_ENV:+--env $WRANGLER_ENV} --remote
      - name: Build
        run: CLOUDFLARE_ENV="$WRANGLER_ENV" npm run build
      - name: Deploy
        id: deploy
        run: |
          out=$(npx wrangler deploy --message "${GITHUB_SHA::7}" 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | grep -oE "https://[a-z0-9.-]+\.workers\.dev" | head -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### ${WRANGLER_ENV:-production}: ${url:-deployed}" >> "$GITHUB_STEP_SUMMARY"
